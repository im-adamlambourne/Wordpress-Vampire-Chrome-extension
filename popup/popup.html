<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Content Studio Plugin — Debug</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="Immediate Media" width="40" height="40">
    <div>
      <h1>Content Studio Plugin</h1>
      <p>Session debug</p>
    </div>
  </header>
  <main>
    <section id="cex-auth" aria-labelledby="cex-heading">
      <h2 id="cex-heading">Content Exchange</h2>
      <p id="cex-status" role="status" aria-live="polite">Checking sign-in…</p>
      <form id="cex-host-form">
        <label for="cex-host">Server</label>
        <input
          id="cex-host"
          name="host"
          type="url"
          inputmode="url"
          autocomplete="url"
          enterkeyhint="done"
          placeholder="http://localhost:8080"
          required
          aria-errormessage="cex-host-error"
        >
        <span id="cex-host-error" class="error-msg">Enter a valid http(s) server URL.</span>
        <button type="submit" id="cex-save-host">Save host</button>
      </form>
      <div class="cex-actions">
        <button type="button" id="cex-login">Log in</button>
        <button type="button" id="cex-logout" class="secondary" hidden>Log out</button>
      </div>
    </section>
    <p id="connection-status" role="status" aria-live="polite">Checking session…</p>
    <dl id="session-details"></dl>
    <section id="fields-section" hidden>
      <h2 id="fields-heading">Form elements</h2>
      <div class="field-scroller" tabindex="0" aria-labelledby="fields-heading">
        <table>
          <caption id="fields-caption"></caption>
          <thead>
            <tr>
              <th scope="col">Field</th>
              <th scope="col">Type</th>
              <th scope="col">Value</th>
            </tr>
          </thead>
          <tbody id="field-rows"></tbody>
        </table>
      </div>
    </section>
    <button type="button" id="refresh">Refresh</button>
  </main>
  <script src="../background/pkce.js"></script>
  <script src="popup.js"></script>
</body>
</html>
