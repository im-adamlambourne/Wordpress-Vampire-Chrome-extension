<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Content Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="Immediate Media" width="40" height="40">
    <div class="header-title">
      <h1>Content Studio</h1>
    </div>
    <div class="header-actions">
      <span id="account-name" hidden></span>
      <button
        type="button"
        class="icon-button"
        id="account-button"
        command="show-modal"
        commandfor="logout-dialog"
        aria-haspopup="dialog"
        aria-controls="logout-dialog"
        aria-expanded="false"
        aria-label="Log out"
        hidden
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </button>
      <button
        type="button"
        class="icon-button"
        id="open-settings"
        aria-haspopup="dialog"
        aria-controls="settings-dialog"
        aria-expanded="false"
        aria-label="Settings"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </button>
    </div>
  </header>
  <main>
    <section id="cex-auth" aria-label="Account">
      <p id="cex-status" role="status" aria-live="polite">Checking sign-in…</p>
    </section>
    <section id="workspace-features" hidden aria-labelledby="workspace-heading">
      <div class="workspace-heading-row">
        <h2 id="workspace-heading">Workspace</h2>
        <p id="workspace-site-name"></p>
      </div>
      <p id="workspace-status" role="status" aria-live="polite" hidden></p>
      <p id="workspace-empty" hidden></p>
      <ul id="workspace-grid" class="feature-grid"></ul>
    </section>
    <div class="cex-actions">
      <button type="button" id="cex-login">Log in</button>
    </div>
  </main>
  <dialog id="logout-dialog" aria-labelledby="logout-heading" closedby="any">
    <form method="dialog">
      <h2 id="logout-heading">Log out?</h2>
      <p>Sign out of Content Studio on this browser.</p>
      <div class="dialog-actions">
        <button type="submit" class="secondary">Cancel</button>
        <button type="button" id="logout-confirm">Log out</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-heading" closedby="any">
    <div class="settings-chrome">
      <h2 id="settings-heading">Settings</h2>
      <button type="button" class="icon-button" id="close-settings" aria-label="Close settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="settings-scroller">
      <section id="workspace-site-section" hidden aria-labelledby="workspace-site-heading">
        <h3 id="workspace-site-heading">Workspace site</h3>
        <form id="workspace-site-form">
          <label id="workspace-site-label" for="workspace-site-select">Site</label>
          <select id="workspace-site-select" name="site" autocomplete="off"></select>
        </form>
      </section>
      <details id="advanced-settings">
        <summary>
          <span class="advanced-label-show">Show advanced settings</span>
          <span class="advanced-label-hide">Hide advanced settings</span>
        </summary>
        <div class="advanced-settings-panel">
          <section id="host-section" aria-labelledby="host-heading">
            <h3 id="host-heading">Server host</h3>
            <form id="cex-host-form">
              <label for="cex-host">Server</label>
              <select id="cex-host" name="host" autocomplete="off" required>
                <option value="https://content-studio.im">Production (content-studio.im)</option>
                <option value="https://develop.content-studio.im" selected>Develop (develop.content-studio.im)</option>
                <option value="http://localhost">Local (localhost)</option>
              </select>
              <button type="submit" id="cex-save-host">Save host</button>
            </form>
          </section>
          <section id="debug-section" tabindex="0" aria-labelledby="debug-heading">
            <h3 id="debug-heading">Session debug</h3>
            <p id="connection-status" role="status" aria-live="polite">Checking session…</p>
            <dl id="session-details"></dl>
            <section id="fields-section" hidden>
              <h4 id="fields-heading">Form elements</h4>
              <div class="field-scroller" aria-labelledby="fields-heading">
                <table>
                  <caption id="fields-caption"></caption>
                  <thead>
                    <tr>
                      <th scope="col">Field</th>
                      <th scope="col">Type</th>
                      <th scope="col">Value</th>
                    </tr>
                  </thead>
                  <tbody id="field-rows"></tbody>
                </table>
              </div>
            </section>
            <button type="button" id="refresh">Refresh</button>
          </section>
        </div>
      </details>
    </div>
  </dialog>
  <script src="../background/pkce.js"></script>
  <script src="popup.js"></script>
</body>
</html>
